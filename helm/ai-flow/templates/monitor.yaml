{{- if .Values.monitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-flow.fullname" . }}-monitor
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mqtt-ui
      port: 5000
      targetPort: mqtt-ui
    - name: telemetry-ui
      port: 6000
      targetPort: telemetry-ui
  selector:
    app.kubernetes.io/name: {{ include "ai-flow.name" . }}-monitor
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-flow.fullname" . }}-monitor
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-flow.name" . }}-monitor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-flow.name" . }}-monitor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-monitor-tables
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import os
              import time
              import psycopg2
              for attempt in range(120):
                  try:
                      connection = psycopg2.connect(
                          host=os.environ["DB_HOST"],
                          port=int(os.environ["DB_PORT"]),
                          dbname=os.environ["DB_NAME"],
                          user=os.environ["DB_USER"],
                          password=os.environ["DB_PASSWORD"],
                          connect_timeout=3,
                      )
                      with connection, connection.cursor() as cursor:
                          cursor.execute("SELECT to_regclass('public.telemetry'), to_regclass('public.mqtt_messages')")
                          telemetry_table, message_table = cursor.fetchone()
                      connection.close()
                      if telemetry_table and message_table:
                          break
                  except psycopg2.OperationalError:
                      pass
                  time.sleep(5)
              else:
                  raise SystemExit("Monitor tables were not initialized in TimescaleDB")
          env:
            - name: DB_HOST
              value: {{ include "ai-flow.fullname" . }}-timescaledb
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-flow.fullname" . }}-credentials
                  key: DB_PASSWORD
      containers:
        - name: monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "ui.monitor"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: mqtt-ui
              containerPort: 5000
            - name: telemetry-ui
              containerPort: 6000
          env:
            - name: DB_HOST
              value: {{ include "ai-flow.fullname" . }}-timescaledb
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-flow.fullname" . }}-credentials
                  key: DB_PASSWORD
            - name: LOG_LEVEL
              value: INFO
          readinessProbe:
            tcpSocket:
              port: mqtt-ui
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt-ui
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.monitor.resources | nindent 12 }}
{{- end }}
