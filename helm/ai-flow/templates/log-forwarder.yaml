{{- if and .Values.splunk.enabled .Values.logForwarder.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-flow.fullname" . }}-fluent-bit
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     1
        Log_Level                 info
        Parsers_File              /fluent-bit/etc/parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_PORT                 2020

    [INPUT]
        Name                      tail
        Path                      /var/log/containers/*.log
        Parser                    cri
        Tag                       kube.*
        DB                        /var/fluent-bit/state/flb.db
        Read_from_Head            On
        Skip_Long_Lines           On
        Mem_Buf_Limit             20MB
        Refresh_Interval          5

    [FILTER]
        Name                      kubernetes
        Match                     kube.*
        Kube_Tag_Prefix           kube.var.log.containers.
        Merge_Log                 On
        Keep_Log                  Off

    [FILTER]
        Name                      grep
        Match                     kube.*
        Regex                     $kubernetes['namespace_name'] ^{{ .Release.Namespace }}$

    [FILTER]
        Name                      grep
        Match                     kube.*
        Exclude                   $kubernetes['pod_name'] ^{{ include "ai-flow.fullname" . }}-(splunk|fluent-bit)-

    [OUTPUT]
        Name                      splunk
        Match                     kube.*
        Host                      {{ include "ai-flow.fullname" . }}-splunk
        Port                      8088
        Splunk_Token              ${SPLUNK_HEC_TOKEN}
        TLS                       Off
        TLS.Verify                Off
        Event_Index               main
        Event_Source              {{ .Release.Namespace }}
        Event_Sourcetype          _json
        Retry_Limit               False
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-flow.fullname" . }}-fluent-bit
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-flow.fullname" . }}-fluent-bit
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-flow.fullname" . }}-fluent-bit
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-flow.fullname" . }}-fluent-bit
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-flow.fullname" . }}-fluent-bit
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ai-flow.fullname" . }}-fluent-bit
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-flow.name" . }}-fluent-bit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-flow.name" . }}-fluent-bit
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "ai-flow.fullname" . }}-fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: {{ .Values.logForwarder.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
          env:
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-flow.fullname" . }}-credentials
                  key: SPLUNK_HEC_TOKEN
          ports:
            - name: metrics
              containerPort: 2020
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-flow.fullname" . }}-fluent-bit
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
{{- end }}
